<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Frontend AI Capstone — a project for building clean, accessible web interfaces."
    />
    <title>Home — Frontend AI Capstone</title>
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a href="/" class="site-logo">Capstone App</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="/" class="site-nav__link" aria-current="page">Home</a>
          <a href="/settings" class="site-nav__link">Settings</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="page-header">
        <h1 class="page-header__title">Welcome</h1>
        <p class="page-header__description">
          Manage your profile and notification preferences from the settings page.
        </p>
      </div>

      <div class="card">
        <div class="card__section">
          <h2 class="card__heading">Get started</h2>
          <p class="card__subheading">
            Update your name, email, and notification settings to personalize your experience.
          </p>
          <a href="/settings" class="btn btn--primary">Go to Settings</a>
        </div>
      </div>
    </main>

    <script src="/js/main.js"></script>
  </body>
</html>
